<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nền (dùng màu theme) -->
  <rect width="512" height="512" fill="#907aa9" rx="120" />
  
  <!-- Chữ A lớn, nổi bật nhất -->
  <text x="256" y="240" font-family="system-ui, sans-serif" font-weight="900" font-size="320" fill="#faf4ed" text-anchor="middle" dominant-baseline="central">A</text>
  
  <!-- Chữ M và P nhỏ hơn ở dưới -->
  <text x="256" y="440" font-family="system-ui, sans-serif" font-weight="700" font-size="120" fill="#faf4ed" text-anchor="middle" letter-spacing="15">MP</text>
</svg>

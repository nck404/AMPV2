name: Deploy Backend to Ubuntu Server

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 103.249.201.193
          username: root
          password: PLaa6jtq
          port: 22
          source: "source/backend/*"
          target: "/var/www/AMPV2"
          strip_components: 0

      - name: Restart Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 103.249.201.193
          username: root
          password: PLaa6jtq
          port: 22
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin
            cd /var/www/AMPV2/source/backend
            
            # Thêm --legacy-peer-deps để tránh lỗi xung đột phiên bản thư viện (ERESOLVE)
            npm install --legacy-peer-deps
            
            # Khởi tạo Prisma (npx sẽ dùng đúng bản prisma v5 nội bộ, không tải bản v7 gây lỗi schema)
            npx prisma generate
            
            # Chạy PM2 thông qua npx để tránh lỗi command not found
            npx pm2 restart backend-api || npx pm2 start server.js --name backend-api

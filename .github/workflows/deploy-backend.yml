name: Deploy Backend to Ubuntu Server

on:
  push:
    branches:
      - main
    # Tạm thời mình comment phần paths này lại để cứ push là chạy, 
    # và thêm workflow_dispatch để bạn có thể bấm nút chạy bằng tay trên GitHub.
    # paths:
    #   - 'source/backend/**'
  
  # Thêm dòng này để cho phép bạn bấm nút "Run workflow" thủ công trên web GitHub
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 103.249.201.193
          username: root
          password: PLaa6jtq
          port: 22
          source: "source/backend/*"
          target: "/var/www/AMPV2"
          strip_components: 0

      - name: Restart Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 103.249.201.193
          username: root
          password: PLaa6jtq
          port: 22
          script: |
            cd /var/www/AMPV2/source/backend
            npm install
            npx prisma generate
            pm2 restart backend-api || pm2 start server.js --name backend-api

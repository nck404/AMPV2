name: Deploy Backend to Ubuntu Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 103.249.201.193
          username: root
          password: PLaa6jtq
          port: 22
          source: "source/backend/*"
          target: "/var/www/AMPV2"
          strip_components: 0

      - name: Restart Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 103.249.201.193
          username: root
          password: PLaa6jtq
          port: 22
          script: |
            # Tự động cài đặt Node.js và npm nếu chưa có
            if ! command -v npm &> /dev/null; then
                echo "Installing Node.js..."
                curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
                apt-get install -y nodejs
            fi
            
            # Tự động cài đặt pm2 nếu chưa có
            if ! command -v pm2 &> /dev/null; then
                echo "Installing PM2..."
                npm install -g pm2
            fi
            
            cd /var/www/AMPV2/source/backend
            npm install
            npx prisma generate
            pm2 restart backend-api || pm2 start server.js --name backend-api
